<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AI Pathfinder</title>

  <style>

    /* Basic colour scheme based on ai-pathfinder.com */

    body {

      margin: 0;

      padding: 0;

      font-family: Arial, sans-serif;

      background-color: #ffffff; /* white base */

      color: #0d192b; /* dark/navy text */

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      text-align: center;

    }

    .container {

      max-width: 600px;

      padding: 20px;

    }

    .logo {

      max-width: 250px;

      margin: 0 auto 30px;

    }

    h1 {

      font-size: 2rem;

      margin-bottom: 10px;

    }

    p {

      font-size: 1rem;

      color: #333333;

    }

    .accent {

      color: #0072ce; /* accent (blue-ish) */

    }

    .footer {

      margin-top: 40px;

      font-size: 0.85rem;

      color: #666666;

    }

    a {

      color: #0072ce;

      text-decoration: none;

    }

    a:hover {

      text-decoration: underline;

    }

  </style>

</head>

<body>


  <div class="container">

    <img class="logo" src="ai-pathfinder_icon_dark-gradient.png" alt="AI Pathfinder Logo">


    <h1 class="accent">AI Pathfinder</h1>

      </p>


    <div class="footer">

      <p>© 2026 AI Pathfinder. All Rights Reserved.</p>

    </div>

  </div>


</body>

</html>
